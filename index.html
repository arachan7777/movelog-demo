<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJPW MOVE LOG（デモ）</title>
  <style>
    :root { --bg:#0b0b0c; --card:#131316; --text:#f2f2f4; --sub:#a8a8b3; --line:#24242a; --accent:#e6c15a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:720px; margin:0 auto; padding:18px 14px 40px; }
    .title { font-weight:800; font-size:22px; }
    .tag { margin-top:6px; color:var(--sub); font-size:13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
    .label { color:var(--sub); font-size:12px; margin-bottom:8px; }
    textarea {
      width:100%; min-height:86px; resize:vertical;
      border-radius:12px; border:1px solid var(--line);
      background:#0f0f12; color:var(--text);
      padding:12px; font-size:16px;
    }
    .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
    button {
      border:1px solid var(--line);
      background:#17171c; color:var(--text);
      border-radius:12px; padding:10px 12px;
      font-size:14px; font-weight:700;
    }
    button.primary { background:#1e1e26; }
    .count { margin-left:auto; color:var(--sub); font-size:12px; }
    .msg { margin-top:10px; padding:10px 12px; border-radius:12px; border:1px dashed #3a3a44; background:#101014; }
    .msg strong { color:var(--accent); }
    .result { display:none; }
    .kicker { color:var(--sub); font-size:12px; }
    .move { font-size:20px; font-weight:900; margin-top:6px; }
    .meta { color:var(--sub); font-size:13px; margin-top:6px; }
    .event { font-size:20px; font-weight:900; margin-top:14px; }
    .hr { height:1px; background:var(--line); margin:14px 0; }
    a { color:var(--accent); text-decoration:none; }
    .pill { display:inline-block; padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--sub); font-size:12px; margin-top:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">NJPW MOVE LOG（デモ）</div>
  <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

  <div class="card">
    <div class="label">今日の一撃（40文字以内推奨）</div>
    <textarea id="diary" placeholder="例：弁当買ったのに、箸が入ってなかった。"></textarea>
    <div class="row">
      <button class="primary" id="judge">技判定</button>
      <button id="clear">消す</button>
      <div class="count"><span id="len">0</span>/40</div>
    </div>
    <div class="msg" id="msg">
      <strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております
    </div>
  </div>

  <div class="card result" id="result">
    <div class="kicker">本日の判定</div>
    <div class="move" id="moveName"></div>
    <div class="meta" id="moveMeta"></div>

    <!-- 事件史（ラベルなし・同格表示） -->
    <div class="event" id="eventText"></div>

    <div class="hr"></div>

    <!-- 動画導線（ここに固定） -->
    <div class="kicker">動画で受ける</div>
    <a id="video" target="_blank">NJPW WORLDで検索</a>
    <div class="pill">会員以外は視聴できなくても導線になる</div>

    <div class="row" style="margin-top:14px;">
      <button id="share">X用文面をコピー</button>
      <button id="copy">技名だけコピー</button>
    </div>
  </div>

  <div class="card">
    <div class="kicker">注意（デモ）</div>
    <div class="meta">
      ・画像・権利物は使わない前提。<br/>
      ・技と日記のズレは仕様。<br/>
      ・このページは触感確認用。
    </div>
  </div>
</div>

<script>
const diary=document.getElementById('diary');
const len=document.getElementById('len');
const msg=document.getElementById('msg');
const result=document.getElementById('result');
const moveName=document.getElementById('moveName');
const moveMeta=document.getElementById('moveMeta');
const eventText=document.getElementById('eventText');
const video=document.getElementById('video');

const moves=[
 {n:"丸め込み",m:"（矢野通／全般） — 一瞬の隙、日常に多い。"},
 {n:"スポイラーチョーカー",m:"（ディック東郷） — 相手のペースに乗らない。締める。"},
 {n:"キドクラッチ",m:"（木戸修） — 静かに怒ってる。今日はそれでいい。"}
];
const events=[
 "今日は“コアに光”のデモ。派手じゃない技が、人生では一番効く。",
 "今日は“日付で語る”入口。1.4や10.12が試合を呼ぶ。",
 "名試合じゃない日が、あとで残る。"
];

diary.oninput=()=>len.textContent=Math.min(diary.value.length,40);

document.getElementById('judge').onclick=()=>{
 const t=diary.value.trim();
 if(!t){msg.innerHTML="<strong>EVIL：</strong>空欄じゃ判定は出来ん！";result.style.display="none";return;}
 const m=moves[Math.floor(Math.random()*moves.length)];
 moveName.textContent=m.n;
 moveMeta.textContent=m.m;
 eventText.textContent=events[Math.floor(Math.random()*events.length)];
 video.href="https://www.google.com/search?q="+encodeURIComponent("NJPW WORLD "+m.n);
 video.textContent="NJPW WORLDで検索（"+m.n+"）";
 result.style.display="block";
};

document.getElementById('clear').onclick=()=>{
 diary.value="";len.textContent=0;result.style.display="none";
};

document.getElementById('share').onclick=()=>{
 navigator.clipboard.writeText("NJPW MOVE LOG 判定："+moveName.textContent);
};
document.getElementById('copy').onclick=()=>{
 navigator.clipboard.writeText(moveName.textContent);
};
</script>
</body>
</html>
