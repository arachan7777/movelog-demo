<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NJPW MOVE LOG（デモ）</title>

<style>
:root {
  --bg:#0b0b0c;
  --card:#131316;
  --text:#f2f2f4;
  --sub:#a8a8b3;
  --line:#24242a;
  --accent:#e6c15a;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap {
  max-width:720px;
  margin:0 auto;
  padding:18px 14px 40px;
}

.title { font-size:22px; font-weight:800; }
.tag { font-size:13px; color:var(--sub); margin-top:6px; }

.card {
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}

.label { font-size:12px; color:var(--sub); margin-bottom:8px; }

textarea {
  width:100%;
  min-height:86px;
  background:#0f0f12;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:16px;
  resize:none;
}

textarea:disabled {
  opacity:0.5;
}

.row {
  display:flex;
  gap:10px;
  align-items:center;
  margin-top:10px;
}

button {
  border:1px solid var(--line);
  background:#17171c;
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
  font-weight:700;
}

button.primary { background:#1e1e26; }

button:disabled {
  opacity:0.4;
}

.count {
  margin-left:auto;
  font-size:12px;
  color:var(--sub);
}

.result { margin-top:14px; }

.move {
  font-size:20px;
  font-weight:900;
  margin-top:4px;
}

.meta { font-size:13px; color:var(--sub); }

.hr { height:1px; background:var(--line); margin:12px 0; }

/* ===== モータル ===== */

.modal {
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  z-index:1000;
}

.modal.show {
  display:block;
  animation: fadeIn 0.15s linear;
}

@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

.modal-box {
  position:absolute;
  width:100%;
  text-align:center;
  top:62vh; /* ← 下寄せ確定 */
  transform:translateY(-50%);
  padding:0 16px;
}

.modal-move {
  font-size:28px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}

/* ===== END ===== */
</style>
</head>

<body>
<div class="wrap">
  <div class="title">NJPW MOVE LOG（デモ）</div>
  <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

  <div class="card">
    <div class="label">今日の一撃（40文字以内推奨）</div>
    <textarea id="diary"></textarea>

    <div class="row">
      <button class="primary" id="judgeBtn">技判定</button>
      <button id="clearBtn">消す</button>
      <div class="count"><span id="len">0</span>/40</div>
    </div>
  </div>

  <div class="card result" id="result" style="display:none;">
    <div class="label">本日の判定</div>
    <div class="move" id="moveName"></div>
    <div class="meta" id="moveMeta"></div>

    <div class="hr"></div>

    <div class="label">動画で受ける</div>
    <div class="meta">
      NJPW WORLDで検索（<span id="moveSearch"></span>）<br>
      会員以外は視聴できなくても導線になる
    </div>

    <div class="hr"></div>

    <div class="label">本日のプロレス事件史</div>
    <div class="move" id="history"></div>
  </div>

  <div class="card">
    <div class="meta">
      ・画像・権利物は使わない前提<br>
      ・技と日記のズレは仕様<br>
      ・このページは触感確認用
    </div>
  </div>
</div>

<!-- モータル -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-move" id="modalMove"></div>
  </div>
</div>

<script>
const diary = document.getElementById("diary");
const len = document.getElementById("len");
const judgeBtn = document.getElementById("judgeBtn");
const clearBtn = document.getElementById("clearBtn");

const result = document.getElementById("result");
const moveName = document.getElementById("moveName");
const moveMeta = document.getElementById("moveMeta");
const moveSearch = document.getElementById("moveSearch");
const history = document.getElementById("history");

const modal = document.getElementById("modal");
const modalMove = document.getElementById("modalMove");

const moves = [
  {name:"スポイラーチョーカー", meta:"（ディック東郷） — 相手のペースに乗らない。締める。"},
  {name:"キドクラッチ", meta:"（木戸修） — 静かに怒ってる。今日はそれでいい。"},
  {name:"昇天・改", meta:"（後藤洋央紀） — 空回りしても最後は立つ。"},
  {name:"丸め込み", meta:"（矢野通／全般） — 一瞬の隙、日常に多い。"}
];

const histories = [
  "日付で語る文化。1.4や10.12が試合を呼ぶ。",
  "コアに光。派手じゃない技が、人生では一番効く。"
];

diary.addEventListener("input", ()=>{
  len.textContent = Math.min(diary.value.length,40);
});

judgeBtn.addEventListener("click", ()=>{
  if(!diary.value.trim()) return;

  const m = moves[Math.floor(Math.random()*moves.length)];
  const h = histories[Math.floor(Math.random()*histories.length)];

  modalMove.textContent = m.name;
  modal.classList.add("show");

  setTimeout(()=>{
    modal.classList.remove("show");

    moveName.textContent = m.name;
    moveMeta.textContent = m.meta;
    moveSearch.textContent = m.name;
    history.textContent = h;

    result.style.display = "block";
    diary.disabled = true;
    judgeBtn.disabled = true;
    clearBtn.disabled = true;
  }, 1600);
});
</script>
</body>
</html>
