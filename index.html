<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJPW MOVE LOG（デモ）</title>
  <style>
    :root { --bg:#0b0b0c; --card:#131316; --text:#f2f2f4; --sub:#a8a8b3; --line:#24242a; --accent:#e6c15a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
    .title { font-weight: 900; letter-spacing: .02em; font-size: 22px; }
    .tag { margin-top:6px; color:var(--sub); font-size: 13px; }

    .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
    .label { color:var(--sub); font-size: 12px; margin-bottom: 8px; }

    textarea {
      width:100%; min-height: 86px; resize: vertical;
      border-radius: 12px; border:1px solid var(--line);
      background:#0f0f12; color:var(--text);
      padding: 12px; font-size: 16px; line-height: 1.4;
      outline: none;
    }
    textarea[disabled]{
      opacity: .6;
      cursor: not-allowed;
    }

    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top: 10px; }
    button {
      appearance:none; border:1px solid var(--line);
      background:#17171c; color:var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 800;
      cursor:pointer;
    }
    button.primary { border-color: #3a3a44; background:#1e1e26; }
    button:hover { filter: brightness(1.05); }
    button[disabled]{
      opacity:.45;
      cursor:not-allowed;
      filter:none;
    }

    .count { margin-left:auto; color:var(--sub); font-size: 12px; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 12px; border:1px dashed #3a3a44; color: var(--text); background:#101014; }
    .msg strong { color: var(--accent); }

    .hr { height:1px; background:var(--line); margin: 12px 0; }

    .result { display:none; }
    .kicker { color:var(--sub); font-size: 12px; }
    .move { font-size: 22px; font-weight: 950; margin-top: 6px; letter-spacing: .02em; }
    .meta { color:var(--sub); font-size: 13px; margin-top: 6px; line-height:1.5; }

    a { color: var(--accent); text-decoration: none; font-weight: 800; }
    a:hover { text-decoration: underline; }

    .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; border:1px solid var(--line); color:var(--sub); font-size: 12px; margin-top: 10px; }
    .toast { display:none; margin-top:10px; color:#b8f5c2; font-size: 12px; }

    /* ===== モータル（画像→技名） ===== */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
      pointer-events: none; /* デモではタップで閉じない */
      background: rgba(0,0,0,0);
      transition: background 200ms ease;
    }
    .modal.on { display:block; }

    /* ① 画像を“しっかり見せる”フェーズ：暗転は弱め、画像を主役に */
    .modal.showimg {
      background: rgba(0,0,0,0.35);
    }

    /* ② 技名表示フェーズ：背景は少し濃く（受け）ただし画像は暗くしない（③） */
    .modal.showmove{
      background: rgba(0,0,0,0.62);
    }

    /* 画面全体の中央にカードを置く（C） */
    .modal-inner {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      /* “やや下寄せ” */
      transform: translateY(6vh);
    }

    /* カード全体（画像＋技名） */
    .modal-stack{
      width: 100%;
      max-width: 560px;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .modal.on .modal-stack{
      opacity: 1;
      transform: translateY(0);
    }

    /* 画像カード（主役） */
    .modal-cardimg{
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      overflow: hidden;
      box-shadow: 0 18px 60px rgba(0,0,0,0.55);
      background: #000;
    }

    .modal-cardimg img{
      width: 100%;
      height: auto;
      display: block;
      /* “もっと明るく・はっきり” */
      filter: brightness(1.18) contrast(1.05) saturate(1.08);
    }

    /* 技名（カードの下に出す：C） */
    .modal-movewrap{
      margin-top: 14px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .modal.showmove .modal-movewrap{
      opacity: 1;
      transform: translateY(0);
    }

    .modal-move {
      display: block;
      white-space: nowrap;  /* 1行強制 */
      overflow: visible;    /* 省略なし */
      font-weight: 950;
      letter-spacing: .02em;
      line-height: 1.05;
      font-size: 42px; /* JSでフィット */
      color: var(--text);
      text-shadow: 0 12px 34px rgba(0,0,0,.60);
    }

    /* ★追加：本日のプロレス事件史を“薄くしない” */
    #historyText{
      color: var(--text);
      font-size: 16px;
      font-weight: 800;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">NJPW MOVE LOG（デモ）</div>
    <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

    <div class="card">
      <div class="label">今日の一撃（40文字以内推奨）</div>
      <textarea id="diary" maxlength="200" placeholder="例：弁当買ったのに、箸が入ってなかった。"></textarea>

      <div class="row">
        <button class="primary" id="judgeBtn">技判定</button>
        <button id="newBtn" style="display:none;">新しい一撃</button>
        <button id="clearBtn">消す</button>
        <div class="count"><span id="len">0</span>/40</div>
      </div>

      <div class="msg" id="systemMsg">
        <strong>一撃で決めろ！</strong><br/>
        ※40文字以内だと閣下は申しております
      </div>
      <div class="toast" id="toast">コピーしました。</div>
    </div>

    <div class="card result" id="resultCard">
      <div class="kicker">本日の判定</div>
      <div class="move" id="moveName">—</div>
      <div class="meta" id="moveMeta">—</div>

      <div class="hr"></div>

      <div class="kicker">動画で受ける</div>
      <div class="meta">
        <a id="videoLink" href="#" target="_blank" rel="noopener">NJPW WORLDで検索（—）</a><br/>
        <span class="pill" id="worldNote">会員以外は視聴できなくても導線になる</span>
      </div>

      <div class="hr"></div>

      <div class="kicker">本日のプロレス事件史</div>
      <div class="meta" id="historyText">—</div>

      <div class="row" style="margin-top:12px;">
        <button id="shareBtn">X用文面をコピー</button>
        <button id="copyMoveBtn">技名だけコピー</button>
      </div>
    </div>

    <div class="card">
      <div class="kicker">注意（デモ）</div>
      <div class="meta">
        ・画像・権利物は使わない前提。<br/>
        ・技と日記のズレは仕様。SNSで広がる“余白”。<br/>
        ・このページは「触感」確認のための疑似サイト。
      </div>
    </div>
  </div>

  <!-- モータル（カード画像→技名） -->
  <div class="modal" id="modal">
    <div class="modal-inner">
      <div class="modal-stack">
        <div class="modal-cardimg">
          <img id="mortalImg" alt="mortal" />
        </div>
        <div class="modal-movewrap">
          <span class="modal-move" id="modalMove">—</span>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const diary = document.getElementById('diary');
  const len = document.getElementById('len');
  const msg = document.getElementById('systemMsg');
  const toast = document.getElementById('toast');

  const resultCard = document.getElementById('resultCard');
  const moveName = document.getElementById('moveName');
  const moveMeta = document.getElementById('moveMeta');
  const videoLink = document.getElementById('videoLink');
  const historyText = document.getElementById('historyText');

  const judgeBtn = document.getElementById('judgeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const newBtn   = document.getElementById('newBtn');
  const shareBtn = document.getElementById('shareBtn');
  const copyMoveBtn = document.getElementById('copyMoveBtn');

  const modal = document.getElementById('modal');
  const modalMove = document.getElementById('modalMove');
  const mortalImgEl = document.getElementById('mortalImg');

  const LIMIT = 40;

  // ===== モータル設定 =====
  const MORTAL_IMG = "mortal.jpg";  // ← あなたがjpgに変更した前提
  const IMG_HOLD = 1000;            // ① 画像を“しっかり見せる”
  const MOVE_HOLD = 1200;           // 技名表示
  const OUT = 320;                  // フェードアウト

  // 仮データ（後で差し替え前提）
  const moves = [
    { name:"ツープラトン誤爆", meta:"（タッグ系／全般）", q:"弁当の箸が無い。だが二人で当たってしまう日もある。" },
    { name:"キドクラッチ", meta:"（木戸修）", q:"静かに怒ってる。今日はそれでいい。" },
    { name:"ケンカキック", meta:"（蝶野正洋）", q:"言い返さず、足だけが出る日。" },
    { name:"腕拉ぎ逆十字固め", meta:"（ケンドー・カシン）", q:"じわじわ効く。気づいた時には取れてる。" },
    { name:"丸め込み", meta:"（矢野通／全般）", q:"一瞬の隙、日常に多い。" },
    { name:"セントーン", meta:"（ヒロ斎藤）", q:"特に何もない日に落ちてくる。" },
    { name:"毒霧", meta:"（ムタ系）", q:"理由が分からない遅延。視界が白い。" },
    { name:"小こけし", meta:"（本間朋晃）", q:"靴下が片方いない。受け身は取れ。" },
    { name:"スポイラーチョーカー", meta:"（ディック東郷）", q:"相手のペースに乗らない。締める。" },
    { name:"昇天・改", meta:"（後藤洋央紀）", q:"空回りしても最後は立つ。" },
  ];

  const histories = [
    "日付で語る文化。1.4や10.12みたいに、数字が試合を呼び出す。",
    "事件史は名試合じゃない。“空気が変わった日”を拾う。",
    "コアに光。派手じゃない技が、人生では一番効く。",
  ];

  function setCount(){
    const n = diary.value.length;
    len.textContent = String(Math.min(n, LIMIT));
    if(n > LIMIT){
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております（現在 "+n+" 文字）";
    } else {
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
    }
  }
  diary.addEventListener('input', setCount);
  setCount();

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function showToast(){
    toast.style.display = "block";
    setTimeout(()=> toast.style.display="none", 1200);
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      showToast();
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
  }

  // 1行強制で、はみ出さないようにサイズを詰める（省略なし）
  function fitOneLine(el, text){
    el.textContent = text;
    const maxW = Math.min(window.innerWidth - 32, 560); // カード幅上限に寄せる
    let size = 42;
    el.style.fontSize = size + "px";
    while(el.scrollWidth > maxW && size > 18){
      size -= 1;
      el.style.fontSize = size + "px";
    }
  }
  window.addEventListener('resize', ()=>{
    if(modal.classList.contains('on')){
      fitOneLine(modalMove, modalMove.textContent);
    }
  });

  // UIロック：判定後は“連続で遊ぶ”に見えないようにする
  function lockAfterJudge(){
    diary.disabled = true;
    judgeBtn.disabled = true;
    clearBtn.disabled = true;
    newBtn.style.display = "inline-block";
  }
  function unlockForNew(){
    diary.disabled = false;
    judgeBtn.disabled = false;
    clearBtn.disabled = false;
    newBtn.style.display = "none";
  }

  function setVideoLinkForMove(moveText){
    // デモでは検索リンク体裁（実運用はNJPW側で差し替え）
    videoLink.href = "#";
    videoLink.textContent = "NJPW WORLDで検索（" + moveText + "）";
    // 将来ここだけ差し替え：
    // videoLink.href = "https://njpwworld.com/search?q=" + encodeURIComponent(moveText);
  }

  // モータル演出：①カード画像を1秒しっかり → ②技名表示（画像は暗くしない） → フェードアウト
  function playMortal(moveText){
    return new Promise((resolve)=>{
      // 画像セット（カードの主役）
      mortalImgEl.src = MORTAL_IMG;

      modal.classList.add('on');
      modal.classList.remove('showimg','showmove');

      // 技名セット＋1行フィット（showmoveの時に出す）
      fitOneLine(modalMove, moveText);

      // 画像を出す
      setTimeout(()=> modal.classList.add('showimg'), 20);

      // ① 画像を“しっかり見せる” → ② 技名へ
      setTimeout(()=> {
        modal.classList.remove('showimg');
        modal.classList.add('showmove');
      }, IMG_HOLD);

      // 技名滞在 → フェードアウト
      setTimeout(()=> {
        modal.classList.remove('showmove');
      }, IMG_HOLD + MOVE_HOLD);

      setTimeout(()=> {
        modal.classList.remove('on','showimg','showmove');
        resolve();
      }, IMG_HOLD + MOVE_HOLD + OUT);
    });
  }

  judgeBtn.addEventListener('click', async ()=>{
    const raw = diary.value.trim();

    if(!raw){
      msg.innerHTML = "<strong>EVIL：</strong>空欄じゃ判定は出来ん！<br/>よ〜く覚えておけ！";
      resultCard.style.display = "none";
      return;
    }

    if(raw.length > LIMIT){
      msg.innerHTML = "<strong>オーカーン：</strong>長文は要らん。削ぎ落とせ。<br/>※40文字以内だと閣下は申しております";
    } else {
      msg.innerHTML = "<strong>判定完了。</strong><br/>当たる日も外れる日もある。それがプロレス。";
    }

    const m = pick(moves);
    moveName.textContent = m.name;
    moveMeta.textContent = m.meta + " — " + m.q;

    setVideoLinkForMove(m.name);
    historyText.textContent = pick(histories);

    lockAfterJudge();

    // モータル（毎回出す）
    await playMortal(m.name);

    resultCard.style.display = "block";
    resultCard.scrollIntoView({behavior:"smooth", block:"start"});
  });

  clearBtn.addEventListener('click', ()=>{
    diary.value = "";
    setCount();
    msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
    resultCard.style.display = "none";
  });

  newBtn.addEventListener('click', ()=>{
    diary.value = "";
    setCount();
    msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
    resultCard.style.display = "none";
    unlockForNew();
    diary.focus();
    diary.scrollIntoView({behavior:"smooth", block:"center"});
  });

  shareBtn.addEventListener('click', ()=>{
    if(resultCard.style.display !== "block") return;
    const text = diary.value.trim().slice(0, LIMIT);
    const share = `NJPW MOVE LOG（デモ）\n今日の一撃：${text}\n判定：${moveName.textContent}\n#NJPW #MOVelog`;
    copyText(share);
  });

  copyMoveBtn.addEventListener('click', ()=>{
    if(resultCard.style.display !== "block") return;
    copyText(moveName.textContent);
  });
})();
</script>
</body>
</html>
