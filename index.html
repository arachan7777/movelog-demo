<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJPW MOVE LOG（デモ）</title>
  <style>
    :root { --bg:#0b0b0c; --card:#131316; --text:#f2f2f4; --sub:#a8a8b3; --line:#24242a; --accent:#e6c15a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 720px; margin: 0 auto; padding: 18px 14px 40px; }
    .title { font-weight: 800; letter-spacing: .02em; font-size: 22px; }
    .tag { margin-top:6px; color:var(--sub); font-size: 13px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
    .label { color:var(--sub); font-size: 12px; margin-bottom: 8px; }
    textarea {
      width:100%; min-height: 86px; resize: vertical;
      border-radius: 12px; border:1px solid var(--line);
      background:#0f0f12; color:var(--text);
      padding: 12px; font-size: 16px; line-height: 1.4;
      outline: none;
    }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top: 10px; }
    button {
      appearance:none; border:1px solid var(--line);
      background:#17171c; color:var(--text);
      border-radius: 12px; padding: 10px 12px; font-size: 14px; font-weight: 700;
      cursor:pointer;
    }
    button.primary { border-color: #3a3a44; background:#1e1e26; }
    button:hover { filter: brightness(1.05); }
    .count { margin-left:auto; color:var(--sub); font-size: 12px; }
    .msg { margin-top: 10px; padding: 10px 12px; border-radius: 12px; border:1px dashed #3a3a44; color: var(--text); background:#101014; }
    .msg strong { color: var(--accent); }
    .hr { height:1px; background:var(--line); margin: 12px 0; }
    .result { display:none; }
    .kicker { color:var(--sub); font-size: 12px; }
    .move { font-size: 20px; font-weight: 900; margin-top: 6px; letter-spacing: .02em; }
    .meta { color:var(--sub); font-size: 13px; margin-top: 6px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .pill { display:inline-block; padding: 4px 10px; border-radius: 999px; border:1px solid var(--line); color:var(--sub); font-size: 12px; margin-top: 10px; }
    .toast { display:none; margin-top:10px; color:#b8f5c2; font-size: 12px; }

    /* ★ 追加：事件史を技名と同格に見せるための微調整 */
    .event {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">NJPW MOVE LOG（デモ）</div>
    <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

    <div class="card">
      <div class="label">今日の一撃（40文字以内推奨
