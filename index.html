<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJPW MOVE LOG（デモ）</title>
  <style>
    :root { --bg:#0b0b0c; --card:#131316; --text:#f2f2f4; --sub:#a8a8b3; --line:#24242a; --accent:#e6c15a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:720px; margin:0 auto; padding:18px 14px 40px; }
    .title { font-size:22px; font-weight:900; letter-spacing:.02em; }
    .tag { margin-top:6px; font-size:13px; color:var(--sub); }

    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
    .label { font-size:12px; color:var(--sub); margin-bottom:8px; }

    textarea {
      width:100%; min-height:86px; resize:vertical;
      border-radius:12px; border:1px solid var(--line);
      background:#0f0f12; color:var(--text);
      padding:12px; font-size:16px; line-height:1.4;
      outline:none;
    }

    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
    button {
      border:1px solid var(--line); background:#17171c; color:var(--text);
      border-radius:12px; padding:10px 12px; font-size:14px; font-weight:700; cursor:pointer;
    }
    button.primary { background:#1e1e26; border-color:#3a3a44; }
    .count { margin-left:auto; font-size:12px; color:var(--sub); }

    .msg { margin-top:10px; padding:10px 12px; border-radius:12px; border:1px dashed #3a3a44; background:#101014; font-size:13px; }
    .msg strong { color:var(--accent); }

    .result { display:none; }

    .section-title { font-size:12px; color:var(--sub); margin-bottom:4px; }
    .move-name { font-size:22px; font-weight:900; letter-spacing:.02em; }
    .move-meta { font-size:13px; color:var(--sub); margin-top:4px; }

    /* 動画導線（先に出す） */
    .video { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
    .video a { color:var(--accent); text-decoration:none; font-weight:700; }
    .video a:hover { text-decoration:underline; }
    .video-note { display:block; margin-top:4px; font-size:12px; color:var(--sub); }

    /* 事件史（後に出す＆技名級にデカく） */
    .history { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
    .history-text { font-size:22px; font-weight:900; letter-spacing:.02em; }

    .toast { display:none; margin-top:10px; font-size:12px; color:#b8f5c2; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">NJPW MOVE LOG（デモ）</div>
  <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

  <div class="card">
    <div class="label">今日の一撃（40文字以内推奨）</div>
    <textarea id="diary" placeholder="例：弁当買ったのに、箸が入ってなかった。"></textarea>

    <div class="row">
      <button class="primary" id="judgeBtn">技判定</button>
      <button id="clearBtn">消す</button>
      <div class="count"><span id="len">0</span>/40</div>
    </div>

    <div class="msg" id="systemMsg">
      <strong>一撃で決めろ！</strong><br>
      ※40文字以内だと閣下は申しております
    </div>
    <div class="toast" id="toast">コピーしました</div>
  </div>

  <div class="card result" id="resultCard">
    <div class="section-title">本日の判定</div>
    <div class="move-name" id="moveName">—</div>
    <div class="move-meta" id="moveMeta">—</div>

    <!-- 動画（先） -->
    <div class="video">
      <div class="section-title">動画で受ける</div>
      <a id="videoLink" href="#" target="_blank" rel="noopener">NJPW WORLDで検索</a>
      <span class="video-note">会員以外は視聴できなくても導線になる</span>
    </div>

    <!-- 事件史（後／技名級） -->
    <div class="history">
      <div class="section-title">本日のプロレス事件史</div>
      <div class="history-text" id="historyText">—</div>
    </div>

    <div class="row" style="margin-top:12px;">
      <button id="shareBtn">X用文面をコピー</button>
      <button id="copyMoveBtn">技名だけコピー</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">注意（デモ）</div>
    <div class="move-meta">
      ・画像・権利物は使わない前提。<br>
      ・技と日記のズレは仕様。<br>
      ・このページは触感確認用。
    </div>
  </div>
</div>

<script>
(() => {
  const diary = document.getElementById('diary');
  const len = document.getElementById('len');
  const msg = document.getElementById('systemMsg');

  const result = document.getElementById('resultCard');
  const moveName = document.getElementById('moveName');
  const moveMeta = document.getElementById('moveMeta');
  const historyText = document.getElementById('historyText');
  const videoLink = document.getElementById('videoLink');
  const toast = document.getElementById('toast');

  const LIMIT = 40;

  // 技（仮）
  const moves = [
    { name:"ツープラトン誤爆", meta:"（タッグ系／全般） — ぶつかったのに、なぜか勝つ日もある。" },
    { name:"キドクラッチ", meta:"（木戸修） — 静かに怒ってる。今日はそれでいい。" },
    { name:"ケンカキック", meta:"（蝶野正洋） — 口より先に、足が出る日。" },
    { name:"腕拉ぎ逆十字固め", meta:"（ケンドー・カシン） — じわじわ効く。気づいた時には取れてる。" },
    { name:"丸め込み", meta:"（矢野通／全般） — 一瞬の隙、日常に多い。" },
    { name:"セントーン", meta:"（ヒロ斎藤） — 特に何もない日に落ちてくる。" },
    { name:"毒霧", meta:"（ムタ系） — 理由が分からない日。視界が白い。" },
    { name:"小こけし", meta:"（本間朋晃） — 無くした。だが受け身は取れ。" },
    { name:"スポイラーチョーカー", meta:"（ディック東郷） — 相手のペースに乗らない。締める。" },
    { name:"昇天・改", meta:"（後藤洋央紀） — 空回りしても最後は立つ。" }
  ];

  // ★ 事件史は技と切り離す（内容が勝手に薄くならない）
  const histories = [
    "日付で語る文化。1.4や10.12みたいに、数字が試合を呼び出す。",
    "名試合じゃなく“空気が変わった日”を拾う。事件史はその入口。",
    "派手じゃない技が、人生では一番効く。だから脇役に光が当たる。",
    "『今日は何もない』日ほど、後で思い出す引き金になることがある。",
    "全国興行の強み。土地が記憶を呼ぶ日がある（ここは拡張の余白）。"
  ];

  function updateCount() {
    const n = diary.value.length;
    len.textContent = String(Math.min(n, LIMIT));
    if (n > LIMIT) {
      msg.innerHTML = "<strong>オーカーン：</strong>長文は要らん。削ぎ落とせ。";
    } else {
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br>※40文字以内だと閣下は申しております";
    }
  }

  diary.addEventListener('input', updateCount);
  updateCount();

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function showToast() {
    toast.style.display = "block";
    setTimeout(() => toast.style.display = "none", 1000);
  }

  async function copy(text) {
    try {
      await navigator.clipboard.writeText(text);
      showToast();
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
  }

  document.getElementById('judgeBtn').onclick = () => {
    const t = diary.value.trim();
    if (!t) {
      msg.innerHTML = "<strong>EVIL：</strong>空欄じゃ判定は出来ん！<br>よ〜く覚えておけ！";
      result.style.display = "none";
      return;
    }

    const m = pick(moves);
    moveName.textContent = m.name;
    moveMeta.textContent = m.meta;

    // 動画導線（先に出す）：検索リンクとして体裁を固定
    const q = encodeURIComponent(m.name);
    videoLink.href = "https://njpwworld.com/search?q=" + q;
    videoLink.textContent = "NJPW WORLDで検索（" + m.name + "）";

    // 事件史（後／技名級の表示）
    historyText.textContent = pick(histories);

    msg.innerHTML = "<strong>判定完了。</strong><br>当たる日も外れる日もある。それがプロレス。";
    result.style.display = "block";
    result.scrollIntoView({ behavior:"smooth", block:"start" });
  };

  document.getElementById('clearBtn').onclick = () => {
    diary.value = "";
    updateCount();
    result.style.display = "none";
  };

  document.getElementById('shareBtn').onclick = () => {
    if (result.style.display !== "block") return;
    const text = diary.value.trim().slice(0, LIMIT);
    copy(`NJPW MOVE LOG（デモ）\n今日の一撃：${text}\n判定：${moveName.textContent}\n#NJPW #MOVelog`);
  };

  document.getElementById('copyMoveBtn').onclick = () => {
    if (result.style.display !== "block") return;
    copy(moveName.textContent);
  };
})();
</script>
</body>
</html>
