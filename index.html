<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NJPW MOVE LOG（デモ）</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --card:#131316;
      --text:#f2f2f4;
      --sub:#a8a8b3;
      --line:#24242a;
      --accent:#e6c15a;
      --danger:#ff5a5f;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{ max-width:720px; margin:0 auto; padding:18px 14px 44px; }

    .title{ font-weight:900; letter-spacing:.02em; font-size:22px; }
    .tag{ margin-top:6px; color:var(--sub); font-size:13px; }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
      margin-top:12px;
    }
    .label{ color:var(--sub); font-size:12px; margin-bottom:8px; }

    textarea{
      width:100%;
      min-height:86px;
      resize:vertical;
      border-radius:12px;
      border:1px solid var(--line);
      background:#0f0f12;
      color:var(--text);
      padding:12px;
      font-size:16px;
      line-height:1.4;
      outline:none;
    }
    textarea[disabled]{
      opacity:.75;
      filter:saturate(.7);
      cursor:not-allowed;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }

    button{
      appearance:none;
      border:1px solid var(--line);
      background:#17171c;
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
    }
    button.primary{ border-color:#3a3a44; background:#1e1e26; }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
    }
    button:hover{ filter:brightness(1.05); }

    .count{ margin-left:auto; color:var(--sub); font-size:12px; }

    .msg{
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px dashed #3a3a44;
      color:var(--text);
      background:#101014;
    }
    .msg strong{ color:var(--accent); }

    .hr{ height:1px; background:var(--line); margin:12px 0; }

    .result{ display:none; }

    .kicker{ color:var(--sub); font-size:12px; }
    .move{ font-size:20px; font-weight:900; margin-top:6px; letter-spacing:.02em; }
    .meta{ color:var(--sub); font-size:13px; margin-top:6px; line-height:1.5; }

    a{ color:var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .pill{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      color:var(--sub);
      font-size:12px;
      margin-top:10px;
    }

    .toast{ display:none; margin-top:10px; color:#b8f5c2; font-size:12px; }

    /* 受け（モータル） */
    .overlay{
      position:fixed;
      inset:0;
      background:#000;
      opacity:0;
      pointer-events:none;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 14px 14vh;
      transition:opacity .18s ease;
      z-index:999;
    }
    .overlay.on{ opacity:.92; pointer-events:auto; }
    .overlayCard{
      width:min(720px, 100%);
      border:1px solid #2a2a31;
      border-radius:16px;
      background:#0b0b0c;
      padding:14px;
    }
    .overlayKicker{
      color:var(--sub);
      font-size:12px;
      letter-spacing:.06em;
    }
    .overlayMove{
      margin-top:8px;
      font-size:24px;
      font-weight:1000;
      letter-spacing:.02em;
    }
    .overlayFakeImg{
      margin-top:12px;
      height:140px;
      border-radius:14px;
      border:1px solid #22222a;
      background:linear-gradient(180deg, #101014, #0b0b0c);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#6c6c77;
      font-size:12px;
      font-weight:700;
    }

    /* 事件史の視認性：技名と同等の強さ */
    .historyTitle{ color:var(--sub); font-size:12px; }
    .historyBig{ font-size:20px; font-weight:900; margin-top:6px; letter-spacing:.02em; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">NJPW MOVE LOG（デモ）</div>
    <div class="tag">日記を書いて、技を受ける。ズレたらズレたで、プロレス。</div>

    <div class="card">
      <div class="label">今日の一撃（40文字以内推奨）</div>
      <textarea id="diary" maxlength="240" placeholder="例：弁当買ったのに、箸が入ってなかった。"></textarea>

      <div class="row">
        <button class="primary" id="judgeBtn">技判定</button>
        <button id="clearBtn">消す</button>
        <div class="count"><span id="len">0</span>/40</div>
      </div>

      <div class="msg" id="systemMsg">
        <strong>一撃で決めろ！</strong><br/>
        ※40文字以内だと閣下は申しております
      </div>
      <div class="toast" id="toast">コピーしました。</div>
    </div>

    <div class="card result" id="resultCard">
      <div class="kicker">本日の判定</div>
      <div class="move" id="moveName">—</div>
      <div class="meta" id="moveMeta">—</div>

      <div class="hr"></div>

      <!-- 動画導線（ここは絶対に消さない） -->
      <div class="kicker">動画で受ける</div>
      <div class="meta">
        <a id="videoLink" href="#" target="_blank" rel="noopener">NJPW WORLDで検索（—）</a><br/>
        <span class="pill">会員以外は視聴できなくても導線になる</span>
      </div>

      <div class="hr"></div>

      <!-- 事件史（見えるように：技名と同等の強さ） -->
      <div class="historyTitle">本日のプロレス事件史</div>
      <div class="historyBig" id="historyText">—</div>

      <div class="hr"></div>

      <div class="row">
        <button id="shareBtn">X用文面をコピー</button>
        <button id="copyMoveBtn">技名だけコピー</button>
      </div>
    </div>

    <div class="card">
      <div class="kicker">注意（デモ）</div>
      <div class="meta">
        ・画像・権利物は使わない前提。<br/>
        ・技と日記のズレは仕様（SNSで広がる“余白”）。<br/>
        ・このページは「触感」確認のための疑似サイト。
      </div>
    </div>
  </div>

  <!-- 受け（暗転＋技名） -->
  <div class="overlay" id="overlay">
    <div class="overlayCard">
      <div class="overlayKicker">RECEIVE</div>
      <div class="overlayMove" id="overlayMove">—</div>
      <div class="overlayFakeImg">画像（仮）｜将来：技ごとに差し替え</div>
    </div>
  </div>

<script>
(function(){
  const diary = document.getElementById('diary');
  const len = document.getElementById('len');
  const msg = document.getElementById('systemMsg');
  const toast = document.getElementById('toast');

  const resultCard = document.getElementById('resultCard');
  const moveName = document.getElementById('moveName');
  const moveMeta = document.getElementById('moveMeta');
  const videoLink = document.getElementById('videoLink');
  const historyText = document.getElementById('historyText');

  const judgeBtn = document.getElementById('judgeBtn');
  const clearBtn = document.getElementById('clearBtn');
  const shareBtn = document.getElementById('shareBtn');
  const copyMoveBtn = document.getElementById('copyMoveBtn');

  const overlay = document.getElementById('overlay');
  const overlayMove = document.getElementById('overlayMove');

  const LIMIT = 40;

  // 仮データ（あとで差し替え想定）
  const moves = [
    { name:"ツープラトン誤爆", meta:"（タッグ系／全般）", q:"弁当の箸が無い。だが二人で当たってしまう日もある。"},
    { name:"キドクラッチ", meta:"（木戸修）", q:"静かに怒ってる。今日はそれでいい。"},
    { name:"ケンカキック", meta:"（蝶野正洋）", q:"言い返さず、足だけが出る日。"},
    { name:"腕拉ぎ逆十字固め", meta:"（ケンドー・カシン）", q:"じわじわ効く。気づいた時には取れてる。"},
    { name:"丸め込み", meta:"（矢野通／全般）", q:"一瞬の隙、日常に多い。"},
    { name:"セントーン", meta:"（ヒロ斎藤）", q:"特に何もない日に落ちてくる。"},
    { name:"毒霧", meta:"（ムタ系）", q:"理由が分からない遅延。視界が白い。"},
    { name:"小こけし", meta:"（本間朋晃）", q:"靴下が片方いない。受け身は取れ。"},
    { name:"スポイラーチョーカー", meta:"（ディック東郷）", q:"相手のペースに乗らない。締める。"},
    { name:"昇天・改", meta:"（後藤洋央紀）", q:"空回りしても最後は立つ。"},
  ];

  const histories = [
    "日付で語る文化。1.4や10.12みたいに、数字が試合を呼び出す。",
    "事件史は名試合じゃない。空気が変わった日を拾う。",
    "コアに光。派手じゃない技が、人生では一番効く。"
  ];

  let locked = false;          // 判定後ロック
  let usedOverlay = false;     // 演出は「一回だけ」

  function setCount(){
    const n = diary.value.length;
    len.textContent = String(Math.min(n, LIMIT));
    if(n > LIMIT){
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております（現在 "+n+" 文字）";
    }else{
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
    }
  }

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function showToast(){
    toast.style.display = "block";
    setTimeout(()=> toast.style.display="none", 1200);
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      showToast();
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast();
    }
  }

  function googleNJPWSearchURL(keyword){
    // NJPW WORLDの検索URL仕様に依存しないよう、確実に動く導線にする
    const q = encodeURIComponent(`site:njpwworld.com ${keyword}`);
    return `https://www.google.com/search?q=${q}`;
  }

  function lockUI(){
    locked = true;
    diary.disabled = true;
    judgeBtn.disabled = true;

    // 「消す」を「新しい一撃」に変える（再判定に見えない）
    clearBtn.textContent = "新しい一撃";
    clearBtn.classList.add("primary");
  }

  function unlockUI(){
    locked = false;
    diary.disabled = false;
    judgeBtn.disabled = false;

    clearBtn.textContent = "消す";
    clearBtn.classList.remove("primary");
  }

  function showOverlayOnce(move){
    if(usedOverlay) return;
    usedOverlay = true;

    overlayMove.textContent = move.name;

    // 一瞬の暗転 → 受け
    overlay.classList.add("on");
    setTimeout(()=>{
      overlay.classList.remove("on");
    }, 520);
  }

  diary.addEventListener('input', ()=>{
    if(locked) return;
    setCount();
  });
  setCount();

  judgeBtn.addEventListener('click', ()=>{
    if(locked) return;

    const raw = diary.value.trim();

    if(!raw){
      // 空欄はEVIL（メッセージのみ。結果は出さない）
      msg.innerHTML = "<strong>EVIL：</strong>空欄じゃ判定は出来ん！<br/>よ〜く覚えておけ！";
      resultCard.style.display = "none";
      return;
    }

    const m = pick(moves);

    // メッセージ
    if(raw.length > LIMIT){
      msg.innerHTML = "<strong>オーカーン：</strong>長文は要らん。削ぎ落とせ。<br/>※40文字以内だと閣下は申しております";
    }else{
      msg.innerHTML = "<strong>判定完了。</strong><br/>当たる日も外れる日もある。それがプロレス。";
    }

    // 結果表示
    moveName.textContent = m.name;
    moveMeta.textContent = `${m.meta} — ${m.q}`;

    // 動画導線（必ず有効なリンク）
    videoLink.href = googleNJPWSearchURL(m.name);
    videoLink.textContent = `NJPW WORLDで検索（${m.name}）`;

    // 事件史（大きく）
    historyText.textContent = pick(histories);

    resultCard.style.display = "block";

    // 演出（1回だけ）
    showOverlayOnce(m);

    // ロック（再判定に見えない）
    lockUI();

    // スクロール
    setTimeout(()=>{
      resultCard.scrollIntoView({behavior:"smooth", block:"start"});
    }, 120);
  });

  clearBtn.addEventListener('click', ()=>{
    // 判定前：普通の消去
    if(!locked){
      diary.value = "";
      setCount();
      msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
      resultCard.style.display = "none";
      return;
    }

    // 判定後：新しい一撃（完全リセット）
    diary.value = "";
    unlockUI();
    usedOverlay = false; // デモ上は「新しい一撃」で演出復活（本番は1日1回に差し替え可能）
    setCount();
    msg.innerHTML = "<strong>一撃で決めろ！</strong><br/>※40文字以内だと閣下は申しております";
    resultCard.style.display = "none";
    diary.focus();
  });

  shareBtn.addEventListener('click', ()=>{
    if(resultCard.style.display !== "block") return;
    const text = diary.value.trim().slice(0, LIMIT);
    const share =
`NJPW MOVE LOG（デモ）
今日の一撃：${text}
判定：${moveName.textContent}
${videoLink.textContent}
#NJPW #MOVelog`;
    copyText(share);
  });

  copyMoveBtn.addEventListener('click', ()=>{
    if(resultCard.style.display !== "block") return;
    copyText(moveName.textContent);
  });

  // オーバーレイはタップでも閉じられる（スマホ向け）
  overlay.addEventListener('click', ()=>{
    overlay.classList.remove("on");
  });
})();
</script>
</body>
</html>
